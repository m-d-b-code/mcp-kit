name: Publish

# `npm version <patch|minor|major>` then `git push --follow-tags`: the tag publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing: npm trusts this workflow of this repository through OIDC, no npm token is
    # stored anywhere. Provenance is attached by npm on its own.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      # Dependents may pick a new version up automatically: nothing leaves without the full check.
      - run: npm run check
      - run: npm publish
